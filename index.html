<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>snowwer shop</title>
    <!-- Подключаем зимний шрифт -->
    <link href="https://fonts.googleapis.com/css2?family=Pirata+One&display=swap" rel="stylesheet">
    <style>
        /* === Глобальные настройки === */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: black; /* полностью чёрный фон */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Pirata One', serif;
            color: white;
            overflow: hidden; /* убираем скролл при появлении окон */
        }

        /* === Главный контейнер === */
        .app {
            position: relative;
            width: 100%;
            max-width: 600px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        /* === Заголовок "snowwer shop" === */
        .main-title {
            font-size: 3.5rem;
            letter-spacing: 6px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            margin-bottom: 40px;
        }

        /* === Меню с тремя главными кнопками === */
        .main-menu {
            display: flex;
            gap: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .main-btn {
            width: 150px;
            height: 80px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            color: white;
            font-family: 'Pirata One', serif;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
        }

        .main-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            transform: scale(0.97);
        }

        /* === Общие стили для всплывающих окон (overlay) === */
        .overlay {
            display: none; /* скрыты по умолчанию */
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .overlay.active {
            display: flex;
        }

        /* === Окна (панели) === */
        .panel {
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 30px 25px;
            max-width: 420px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            color: white;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.7);
        }

        .panel h2 {
            font-size: 2rem;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        .panel p {
            font-size: 1.1rem;
            line-height: 1.5;
            margin-bottom: 15px;
            text-align: center;
        }

        .panel .price {
            font-size: 1.3rem;
            color: #aad0ff;
        }

        /* === Кнопки внутри панелей === */
        .panel-btn {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
                        backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 10px;
            padding: 10px 25px;
            font-family: 'Pirata One', serif;
            font-size: 1.2rem;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            margin: 5px;
        }

        .panel-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0.95);
        }

        .panel-btn.back {
            background: rgba(180, 0, 0, 0.2);
            border-color: rgba(255, 80, 80, 0.4);
        }

        .panel-btn.back:hover {
            background: rgba(180, 0, 0, 0.4);
        }

        /* === Сетка для квадратов услуг (2 или 3 колонки) === */
        .services-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }

        .service-card {
            background: rgba(20, 30, 50, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 15px;
            padding: 20px 15px;
            text-align: center;
            min-width: 140px;
            flex: 1 1 130px;
            transition: 0.2s;
        }

        .service-card h3 {
            font-size: 1.4rem;
            margin-bottom: 8px;
        }

        .service-card .price {
            font-size: 1.2rem;
            color: #ffd700;
            display: block;
            margin-bottom: 12px;
        }

        .service-card .panel-btn {
            padding: 8px 20px;
        }

        /* === Адаптация под маленькие экраны === */
        @media (max-width: 500px) {
            .main-title {
                font-size: 2.5rem;
                margin-bottom: 30px;
            }
            .main-btn {
                width: 130px;
                height: 65px;
                font-size: 1rem;
            }
            .panel {
                padding: 20px 15px;
            }
            .service-card {
                min-width: 120px;
            }
        }
    </style>
</head>
<body>

<div class="app">
    <h1 class="main-title">snowwer shop</h1>

    <div class="main-menu">
        <button class="main-btn" onclick="openMainMenu('services')">поиск информации людей</button>
        <button class="main-btn" onclick="showError()">табачка</button>
        <button class="main-btn" onclick="openMainMenu('signs')">сигны</button>
    </div>
</div>

<!-- Overlay для всплывающих окон -->
<div id="overlay" class="overlay">
    <div id="panelContent" class="panel">
        <!-- Сюда будет вставляться динамический контент -->
    </div>
</div>

<script>
    // === Глобальные переменные ===
    const overlay = document.getElementById('overlay');
    const panelContent = document.getElementById('panelContent');
    let currentView = 'main'; // main, services, signs, details, etc.
    let servicesAdded = false; // была ли добавлена услуга "поиск информации" после возврата

    // === Функции управления окнами ===
    function showPanel(html) {
        panelContent.innerHTML = html;
        overlay.classList.add('active');
    }

    function closePanel() {
        overlay.classList.remove('active');
        panelContent.innerHTML = '';
        currentView = 'main';
    }

    // === Главная кнопка "назад" (общая) ===
    function goBack() {
        closePanel();
        // После возврата из меню "поиск информации людей" добавляем вторую услугу
        if (currentView === 'services' && !servicesAdded) {
            servicesAdded = true;
            // Ничего дополнительно не делаем, услуга будет показана при следующем открытии
        }
    }

    // === Обработчик "табачка" (ошибка) ===
    function showError() {
        showPanel(`
            <h2>❌ Ошибка</h2>
            <p style="font-size:1.5rem;">товаров нету в наличии.</p>
                        <button class="panel-btn back" onclick="closePanel()">Назад</button>
        `);
    }

    // === Открыть главное меню "поиск информации людей" или "сигны" ===
    function openMainMenu(type) {
        currentView = type;
        if (type === 'services') {
            let servicesHtml = `
                <h2>🔍 Поиск информации людей</h2>
                <div class="services-grid">
            `;
            // Первая услуга (снос) доступна всегда
            servicesHtml += `
                <div class="service-card">
                    <h3>снос аккаунта</h3>
                    <span class="price">250р</span>
                    <button class="panel-btn" onclick="openServiceDetails('snos')">купить</button>
                </div>
            `;
            // Вторая услуга (поиск информации) появляется после первого возврата
            if (servicesAdded) {
                servicesHtml += `
                    <div class="service-card">
                        <h3>поиск информации</h3>
                        <span class="price">500р</span>
                        <button class="panel-btn" onclick="openServiceDetails('search')">купить</button>
                    </div>
                `;
            }
            servicesHtml += `</div><button class="panel-btn back" onclick="goBack()">Назад</button>`;
            showPanel(servicesHtml);
        } else if (type === 'signs') {
            currentView = 'signs';
            showPanel(`
                <h2>🎨 Сигны</h2>
                <div class="services-grid">
                    <div class="service-card">
                        <h3>аниме сигна</h3>
                        <span class="price">50р</span>
                        <button class="panel-btn" onclick="openServiceDetails('anime-sign')">купить</button>
                    </div>
                    <div class="service-card">
                        <h3>портрет с человеком</h3>
                        <span class="price">200р</span>
                        <button class="panel-btn" onclick="openServiceDetails('portrait')">купить</button>
                    </div>
                </div>
                <button class="panel-btn back" onclick="closePanel()">Назад</button>
            `);
        }
    }

    // === Открыть подробности услуги ===
    function openServiceDetails(service) {
        let html = '';
        if (service === 'snos') {
            html = `
                <h2>📋 Подробности сноса</h2>
                <p>Не стопроцентный. Вы оплачиваете 250р только тогда, когда аккаунт будет снесен.<br>Время ожидания 1–7 дней.</p>
                <button class="panel-btn back" onclick="openMainMenu('services')">Назад</button>
            `;
        } else if (service === 'search') {
            html = `
                <h2>📋 Подробнее</h2>
                <p>Поиск данных людей тоже не стопроцентный.<br>Примерный срок исполнения до 3 дней.</p>
                <button class="panel-btn back" onclick="openMainMenu('services')">Назад</button>
            `;
        } else if (service === 'anime-sign') {
            html = `
                <h2>📋 Подробности</h2>
                <p>Аниме сигна — вы даёте мне название вашего аниме персонажа, фон и текст, который там должен присутствовать. После чего я вам дам итог работы.</p>
                <button class="panel-btn back" onclick="openMainMenu('signs')">Назад</button>
            `;
        } else if (service === 'portrait') {
            html = `
                <h2>📋 Подробности</h2>
                <p>Портрет с человеком — вы даёте мне своё фото в полный рост и фото аниме персонажа / вашей подруги / друга или же любого человека в мире (даже флаттершай, к примеру).</p>
                <button class="panel-btn back" onclick="openMainMenu('signs')">Назад</button>
            `;
        }
        showPanel(html);
    }

    // === Закрытие оверлея по клику вне панели ===
    overlay.addEventListener('click', function(e) {
        if (e.target === overlay) {
            closePanel();
        }
    });
        // === Инициализация: услуга "поиск информации" не добавлена до первого возврата ===
    // При первом открытии "поиск информации людей" она не появится, пока пользователь не нажмёт "назад"
    // Позже при повторном открытии она будет видна.
</script>

</body>
</html>
