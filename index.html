<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>snowwer shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="app">
        <!-- Главное меню -->
        <div id="main-menu" class="screen">
            <h1>snowwer shop</h1>
            <div class="button-group">
                <button onclick="showScreen('search-menu')">поиск информации людей</button>
                <button onclick="showError()">табачка</button>
                <button onclick="showScreen('signs-menu')">сигны</button>
            </div>
        </div>

        <!-- Меню: Поиск информации -->
        <div id="search-menu" class="screen hidden">
            <div class="button-group">
                <div class="card">
                    <h3>снос аккаунта</h3>
                    <p>250р</p>
                    <button onclick="showModal('details-ban')">купить</button>
                </div>
                <div class="card">
                    <h3>поиск информации</h3>
                    <p>500р</p>
                    <button onclick="showModal('details-info')">купить</button>
                </div>
                <button class="back-btn" onclick="showScreen('main-menu')">Назад</button>
            </div>
        </div>

        <!-- Меню: Сигны -->
        <div id="signs-menu" class="screen hidden">
            <div class="button-group">
                <div class="card">
                    <h3>аниме сигна</h3>
                    <p>50р</p>
                    <button onclick="showModal('details-anime')">купить</button>
                </div>
                <div class="card">
                    <h3>Портрет с человеком</h3>
                    <p>200р</p>
                    <button onclick="showModal('details-portrait')">купить</button>
                </div>
                <button class="back-btn" onclick="showScreen('main-menu')">Назад</button>
            </div>
        </div>
    </div>

    <!-- Модальные окна (детали) -->
    <div id="modal" class="modal hidden">
        <div class="modal-content">
            <h2 id="modal-title"></h2>
            <p id="modal-text"></p>
            <button onclick="closeModal()">Назад</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
